name: video_player
version: 3.4.0
description: >-
  A comprehensive Flutter video player plugin with native Android (ExoPlayer), iOS (AVPlayer), and macOS (AVPlayer) 
  implementations. Features include HLS streaming, quality selection, speed control, fullscreen 
  playback, embedded platform views, Picture-in-Picture, and iOS screen protection.
homepage: https://github.com/SunnatilloShavkatov/video_player
repository: https://github.com/SunnatilloShavkatov/video_player

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.1.0

flutter:
  plugin:
    platforms:
      android:
        package: uz.shs.video_player
        pluginClass: VideoPlayerPlugin
      ios:
        pluginClass: SwiftVideoPlayerPlugin
      macos:
        pluginClass: VideoPlayerPlugin